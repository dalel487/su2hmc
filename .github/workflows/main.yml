# Deploys Doxygen docs to GitHub Pages via the native Actions/artifact model.
# No push to a 'pages' branch -> branch rulesets do not apply to deployment.
# Deployment is gated by the github-pages environment (restrict to master in
# Settings -> Environments -> github-pages -> Deployment branches).
name: Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: [ master ]

# Least-privilege token; id-token is required by deploy-pages for OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Don't run two deploys on top of each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Doxygen
        uses: mattnotmitt/doxygen-action@edge
        with:
          doxyfile-path: /github/workspace/docs/doxygen_config
          working-directory: /github/workspace/docs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/html

  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
